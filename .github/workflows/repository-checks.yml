name: Repository checks
on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop, staging, main]
permissions:
  contents: read
jobs:
  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify repository policy
        run: node scripts/verify-repository.mjs
      - name: Verify whitespace
        run: git diff --check
      - name: Install development tooling
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Verify API foundation
        run: npm run verify
      - name: Verify complete local integration
        timeout-minutes: 15
        run: npm run test:local
      - name: Check local database security
        run: npx supabase db advisors --local --type security --level warn --fail-on error
      - name: Stop local services and preserve volumes
        if: always()
        run: npm run dev:stop
